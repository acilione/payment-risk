name: release-image
on:
  push:
    tags: ['v*']
permissions: {contents: read, packages: write}
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B spotless:check verify cyclonedx:makeAggregateBom
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          load: true
          tags: payment-risk:scan
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: {image-ref: 'payment-risk:scan', severity: 'HIGH,CRITICAL', exit-code: '1', ignore-unfixed: true}
      - name: Qualify the scanned image
        run: |
          docker tag payment-risk:scan payment-risk:0.1.0
          python3 scripts/init-env.py
          docker compose up -d --no-build
          make run-job integration-test recovery-test stop-job restore integration-test idle-resume-test verify-observability
      - name: Publish the same qualified image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image_ref="ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_TAG}"
          docker tag payment-risk:scan "$image_ref"
          docker push "$image_ref"
      - if: always()
        run: docker compose logs --no-color > compose.log && docker compose down
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-evidence
          path: |
            target/bom.*
            artifacts/*.json*
            compose.log
