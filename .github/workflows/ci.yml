name: verify
on:
  push:
    branches: [main]
    paths-ignore: ['web/**', 'docs/**', 'README.md', '.github/workflows/website.yml']
  pull_request:
    paths-ignore: ['web/**', 'docs/**', 'README.md', '.github/workflows/website.yml']
permissions: {contents: read}
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B spotless:check verify cyclonedx:makeAggregateBom
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: mvn -B -Dtest=StateLoadTest -Drisk.load=true test
      - run: python3 scripts/init-env.py && docker compose config --quiet
      - run: pip install PyYAML==6.0.3 jsonschema==4.26.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with: {version: v4.2.4}
      - run: python3 scripts/verify-deployment.py
      - run: docker run --rm -v "$PWD/observability/prometheus:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v3.14.0 test rules alerts.test.yml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-and-sbom
          path: |
            target/
            artifacts/state-load.json
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make up run-job simulate-customers integration-test recovery-test
      - run: make stop-job restore integration-test idle-resume-test verify-observability
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '24.20.0'}
      - name: Verify direct and published analytics
        run: |
          node --env-file=.env scripts/benchmark-investigation.mjs
          cp artifacts/investigation-load.json artifacts/investigation-direct.json
          RISK_QUERY_MODE=snapshot RISK_QUERY_STAGES=1000,10000,50000,250000 node --env-file=.env scripts/benchmark-investigation.mjs
          cp artifacts/investigation-load.json artifacts/investigation-snapshot.json
      - run: python3 scripts/verify-materializer.py
      - run: make stop-job && python3 scripts/verify-ingress.py
      - name: Configurable generator through the full pipeline
        run: |
          docker compose down
          pip install playwright==1.62.0
          python3 -m playwright install --with-deps chromium
          python3 scripts/verify-showcase-recovery.py
          python3 scripts/verify-website.py --url http://127.0.0.1:23001/
          make showcase-stop
      - if: always()
        run: |
          docker compose logs --no-color > compose.log
          docker compose down
          if [ -f artifacts/showcase/compose.env ]; then
            docker compose -p payment-risk-showcase --env-file .env --env-file artifacts/showcase/compose.env -f docker-compose.yml -f docker-compose.showcase.yml logs --no-color > showcase-compose.log
            docker compose -p payment-risk-showcase --env-file .env --env-file artifacts/showcase/compose.env -f docker-compose.yml -f docker-compose.showcase.yml down
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: integration-evidence
          path: |
            compose.log
            artifacts/*.json*
            showcase-compose.log
            artifacts/showcase/**/*.json*
            artifacts/showcase/**/*.log
            artifacts/website/
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: {scan-type: fs, scan-ref: '.', severity: 'HIGH,CRITICAL', exit-code: '1', ignore-unfixed: true}
  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: {terraform_version: 1.16.1}
      - run: terraform -chdir=infrastructure/terraform init -backend=false -lockfile=readonly
      - run: terraform -chdir=infrastructure/terraform fmt -check
      - run: terraform -chdir=infrastructure/terraform validate
