rule_files: [alerts.yml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="flink",instance="taskmanager:9249"}'
        values: '0 0 0 0'
    alert_rule_test:
      - eval_time: 3m
        alertname: FlinkMetricsUnavailable
        exp_alerts:
          - exp_labels: {job: flink, instance: 'taskmanager:9249', severity: critical}
            exp_annotations:
              summary: Flink metrics endpoint is unavailable
              runbook: README.md#operations
  - interval: 1m
    input_series:
      - series: 'risk_materializer_unresolved_records{job="materializer"}'
        values: '0 2 2'
    alert_rule_test:
      - eval_time: 2m
        alertname: MaterializerIntegrityConflict
        exp_alerts:
          - exp_labels: {job: materializer, severity: critical}
            exp_annotations: {summary: Stored decisions contain unresolved conflicts or quarantined records}
  - interval: 1m
    input_series:
      - series: 'up{job="payment-archiver",instance="payment-archiver:9406"}'
        values: '0 0 0 0'
    alert_rule_test:
      - eval_time: 3m
        alertname: PaymentArchiveUnavailable
        exp_alerts:
          - exp_labels: {job: payment-archiver, instance: 'payment-archiver:9406', severity: critical}
            exp_annotations: {summary: Payment input archival is unavailable; preserve the Kafka log}
