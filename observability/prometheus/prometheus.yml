global:
  scrape_interval: 10s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: flink
    static_configs:
      - targets: ['jobmanager:9249', 'taskmanager:9249']
  - job_name: materializer
    static_configs:
      - targets: ['materializer:9405']
  - job_name: payment-archiver
    static_configs:
      - targets: ['payment-archiver:9406']
