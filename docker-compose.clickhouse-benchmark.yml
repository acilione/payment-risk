name: payment-risk-clickhouse-bench

services:
  keeper:
    image: clickhouse/clickhouse-server:26.8.2.7
    entrypoint: [clickhouse, keeper, --config-file=/etc/clickhouse-keeper/keeper.xml]
    volumes:
      - ./infrastructure/benchmark/keeper.xml:/etc/clickhouse-keeper/keeper.xml:ro
      - benchmark-keeper:/var/lib/clickhouse
    cpus: 1
    mem_limit: 512m
  benchmark-clickhouse:
    image: clickhouse/clickhouse-server:26.8.2.7
    environment:
      CLICKHOUSE_DB: benchmark
      CLICKHOUSE_USER: risk
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Initialize .env first}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - benchmark-clickhouse:/var/lib/clickhouse
      - ./infrastructure/benchmark/clickhouse.xml:/etc/clickhouse-server/config.d/benchmark.xml:ro
    ports: ['127.0.0.1:38123:8123']
    cpus: 2
    mem_limit: 2g
    depends_on: [keeper]
    healthcheck:
      test: [CMD, wget, --spider, -q, http://localhost:8123/ping]
      interval: 3s
      retries: 30
  benchmark-postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: risk
      POSTGRES_USER: risk
      POSTGRES_PASSWORD: ${RISK_DB_PASSWORD:?Initialize .env first}
    volumes:
      - benchmark-postgres:/var/lib/postgresql
      - ./infrastructure/docker/postgres.sql:/docker-entrypoint-initdb.d/001-risk.sql:ro
    ports: ['127.0.0.1:35432:5432']
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U risk -d risk']
      interval: 3s
      retries: 30
  connect:
    image: payment-risk-clickhouse-connect:1.7.0
    build:
      context: .
      dockerfile: infrastructure/benchmark/connect.Dockerfile
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: clickhouse-benchmark-connect-v1
      CONNECT_CONFIG_STORAGE_TOPIC: bench.connect.config
      CONNECT_OFFSET_STORAGE_TOPIC: bench.connect.offsets
      CONNECT_STATUS_STORAGE_TOPIC: bench.connect.status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://registry:8080/apis/ccompat/v7
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      CONNECT_CONNECTOR_CLIENT_CONFIG_OVERRIDE_POLICY: All
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 1000
      CONNECT_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports: ['127.0.0.1:38083:8083']
    networks: [default, source]
    cpus: ${BENCHMARK_CONNECT_CPUS:-1}
    mem_limit: 1g
    depends_on:
      benchmark-clickhouse: {condition: service_healthy}
  producer:
    profiles: [tools]
    image: payment-risk:0.1.0
    entrypoint: [java, -Xmx256m, -cp, /opt/flink/usrlib/risk-engine.jar, com.portfolio.paymentrisk.tools.SinkBenchmarkProducer]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://registry:8080/apis/ccompat/v7
    networks: [default, source]
    cpus: 1
    mem_limit: 512m
  postgres-materializer:
    profiles: [tools]
    image: payment-risk:0.1.0
    entrypoint: [java, -Xmx512m, -cp, /opt/flink/usrlib/risk-engine.jar, com.portfolio.paymentrisk.tools.DecisionMaterializer]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://registry:8080/apis/ccompat/v7
      RISK_JDBC_URL: jdbc:postgresql://benchmark-postgres:5432/risk
      RISK_DB_USER: risk
      RISK_DB_PASSWORD: ${RISK_DB_PASSWORD}
      MATERIALIZER_GROUP: ${BENCHMARK_GROUP:-benchmark-unconfigured}
      DECISIONS_TOPIC: ${BENCHMARK_TOPIC:-benchmark-unconfigured}
      DLQ_TOPIC: ${BENCHMARK_TOPIC:-benchmark-unconfigured}.dlq
      LATE_TOPIC: ${BENCHMARK_TOPIC:-benchmark-unconfigured}.late
      INGEST_MAX_POLL_RECORDS: 250
    networks: [default, source]
    cpus: 1
    mem_limit: 1g

networks:
  source:
    external: true
    name: ${BENCHMARK_SOURCE_NETWORK:-payment-risk-showcase_default}
volumes:
  benchmark-keeper:
  benchmark-clickhouse:
  benchmark-postgres:
